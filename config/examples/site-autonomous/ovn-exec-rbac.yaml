# Optional access method used by this example: execute the installed OVN tools
# in the local Kube-OVN central Pod. This grants exec in kube-system; Kubernetes
# RBAC cannot constrain the remote command or select Pods by label. Review this
# broader permission, or use separately provisioned direct OVN TLS access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: site-vpc-ovn-exec
  namespace: kube-system
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [ovn-central]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: site-vpc-ovn-exec
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: site-vpc-ovn-exec
subjects:
  - kind: ServiceAccount
    name: site-vpc-controller
    namespace: global-vpc-system
