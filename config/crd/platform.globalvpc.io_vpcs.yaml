apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vpcs.platform.globalvpc.io
spec:
  group: platform.globalvpc.io
  names:
    kind: VPC
    listKind: VPCList
    plural: vpcs
    shortNames:
    - pvpc
    singular: vpc
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.networkClassRef
      name: Class
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: A project-scoped, platform-managed global logical VPC. Native
          Kube-OVN resources are generated; existing networks are not implicitly adopted.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              networkClassRef:
                default: default
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
            type: object
            x-kubernetes-validations:
            - message: The network class is immutable; transport changes require a
                managed migration.
              rule: self == oldSelf
          status:
            properties:
              bindings:
                items:
                  properties:
                    locationRef:
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    name:
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    nativeVpcName:
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    uid:
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - locationRef
                  - name
                  - uid
                  type: object
                maxItems: 4096
                type: array
                x-kubernetes-list-map-keys:
                - locationRef
                x-kubernetes-list-type: map
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      minLength: 1
                      type: string
                  required:
                  - type
                  - status
                  - reason
                  - message
                  - lastTransitionTime
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              networkID:
                format: int64
                maximum: 16777215
                minimum: 1
                type: integer
              observedGeneration:
                format: int64
                minimum: 0
                type: integer
              phase:
                maxLength: 128
                type: string
              subnetClaims:
                items:
                  properties:
                    cidr:
                      maxLength: 18
                      minLength: 9
                      type: string
                      x-kubernetes-validations:
                      - message: Use a canonical IPv4 network prefix from /8 through
                          /30.
                        rule: isCIDR(self) && cidr(self).ip().family() == 4 && cidr(self).prefixLength()
                          >= 8 && cidr(self).prefixLength() <= 30 && cidr(self) ==
                          cidr(self).masked()
                    locationRef:
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    subnetUID:
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - subnetUID
                  - cidr
                  - locationRef
                  type: object
                maxItems: 4096
                type: array
                x-kubernetes-list-map-keys:
                - subnetUID
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
