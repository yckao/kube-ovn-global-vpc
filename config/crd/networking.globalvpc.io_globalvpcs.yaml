apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: globalvpcs.networking.globalvpc.io
spec:
  group: networking.globalvpc.io
  scope: Cluster
  names:
    kind: GlobalVpc
    listKind: GlobalVpcList
    plural: globalvpcs
    singular: globalvpc
    shortNames:
      - gvpc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: Immutable routed tenant intent for every registered cluster in one interconnection domain.
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: GlobalVpc spec is immutable; create a separate GlobalVpc for topology changes.
              required:
                - domainRef
                - ipam
                - transitCIDR
                - attachments
              properties:
                domainRef:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: Administrator-registered domain served by this controller.
                ipam:
                  type: object
                  required:
                    - providerRef
                    - scopeRef
                  properties:
                    providerRef:
                      type: string
                      minLength: 1
                      maxLength: 253
                    scopeRef:
                      type: string
                      minLength: 1
                      maxLength: 253
                      description: Preprovisioned tenant scope in the external address registry.
                transitCIDR:
                  type: string
                  minLength: 9
                  maxLength: 18
                  pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([89]|[12][0-9]|30)$'
                  description: Canonical IPv4 /8 through /30; every usable address is excluded from endpoint IPAM.
                attachments:
                  type: array
                  minItems: 2
                  maxItems: 32
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - clusterRef
                  items:
                    type: object
                    required:
                      - clusterRef
                      - cidr
                      - gateway
                      - transitIP
                    properties:
                      clusterRef:
                        type: string
                        minLength: 1
                        maxLength: 253
                        pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                      cidr:
                        type: string
                        minLength: 9
                        maxLength: 18
                        pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([89]|[12][0-9]|30)$'
                      gateway:
                        type: string
                        minLength: 7
                        maxLength: 15
                        pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
                      transitIP:
                        type: string
                        minLength: 7
                        maxLength: 15
                        pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                phase:
                  type: string
                  maxLength: 64
                operation:
                  type: string
                  maxLength: 64
                planHash:
                  type: string
                  maxLength: 64
                transitSwitchUID:
                  type: string
                  maxLength: 128
                allocations:
                  type: array
                  maxItems: 33
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - claimUID
                  items:
                    type: object
                    required:
                      - claimUID
                      - vpcUID
                      - scopeRef
                      - cidr
                      - allocationID
                      - releasePolicy
                    properties:
                      claimUID:
                        type: string
                        maxLength: 253
                      vpcUID:
                        type: string
                        maxLength: 63
                      scopeRef:
                        type: string
                        maxLength: 253
                      cidr:
                        type: string
                        maxLength: 18
                      allocationID:
                        type: string
                        maxLength: 1024
                      releasePolicy:
                        type: string
                        enum:
                          - Retain
                resources:
                  type: array
                  maxItems: 96
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - clusterRef
                    - kind
                    - name
                  items:
                    type: object
                    required:
                      - clusterRef
                      - kind
                      - name
                      - uid
                    properties:
                      clusterRef:
                        type: string
                        maxLength: 253
                      kind:
                        type: string
                        maxLength: 63
                      name:
                        type: string
                        maxLength: 253
                      uid:
                        type: string
                        maxLength: 128
                attachments:
                  type: array
                  maxItems: 32
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - clusterRef
                  items:
                    type: object
                    required:
                      - clusterRef
                      - vpcName
                      - subnetName
                      - transitSwitchName
                    properties:
                      clusterRef:
                        type: string
                        maxLength: 253
                      vpcName:
                        type: string
                        maxLength: 253
                      subnetName:
                        type: string
                        maxLength: 253
                      transitSwitchName:
                        type: string
                        maxLength: 253
                conditions:
                  type: array
                  maxItems: 16
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                      status:
                        type: string
                        enum:
                          - 'True'
                          - 'False'
                          - Unknown
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
