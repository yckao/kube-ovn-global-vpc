apiVersion: v1
kind: Namespace
metadata:
  name: global-vpc-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-vpc-authority
  namespace: global-vpc-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-vpc-authority
rules:
  - apiGroups: [platform.globalvpc.io]
    resources: [vpcs, subnets, networkbindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [platform.globalvpc.io]
    resources: [vpcs/status, subnets/status, networkbindings/status]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-vpc-authority
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-vpc-authority
subjects:
  - kind: ServiceAccount
    name: platform-vpc-authority
    namespace: global-vpc-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-vpc-authority
  namespace: global-vpc-system
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, create, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-vpc-authority
  namespace: global-vpc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-vpc-authority
subjects:
  - kind: ServiceAccount
    name: platform-vpc-authority
    namespace: global-vpc-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-vpc-authority
  namespace: global-vpc-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-vpc-authority
  template:
    metadata:
      labels:
        app: platform-vpc-authority
    spec:
      serviceAccountName: platform-vpc-authority
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: platform-vpc-authority
                topologyKey: kubernetes.io/hostname
      containers:
        - name: controller
          image: REPLACE_WITH_PLATFORM_CONTROLLER_IMAGE_DIGEST
          args: [--mode=authority, --config=/config/platform.json]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 384Mi
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: platform-vpc-config
