apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "global-vpc-site.fullname" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "global-vpc-site.guardRole" . }}
rules:
  - apiGroups: ['']
    resources: [nodes, pods]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
  - apiGroups: [kubeovn.io]
    resources: [vpcs, subnets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kubeovn.io]
    resources: [ips]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [vpcs.kubeovn.io]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "global-vpc-site.guardRole" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "global-vpc-site.guardRole" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "global-vpc-site.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "global-vpc-site.fullname" . }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [platform.globalvpc.io]
    resources: [networkbindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [platform.globalvpc.io]
    resources: [networkbindings/status]
    verbs: [get, update, patch]
  - apiGroups: [platform.globalvpc.io]
    resources: [networkbindings/finalizers]
    verbs: [update]
  - apiGroups: ['']
    resources: [pods, configmaps, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "global-vpc-site.fullname" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "global-vpc-site.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "global-vpc-site.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "global-vpc-site.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "global-vpc-site.fullname" . }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "global-vpc-site.local" . | sha256sum }}
        checksum/authority-access: {{ .Values.authorityAccess.kubeconfig | sha256sum }}
      labels:
        app: {{ include "global-vpc-site.fullname" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "global-vpc-site.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ include "global-vpc-site.fullname" . }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: controller
          image: {{ include "global-vpc-site.image" .Values.image | quote }}
          args: [--mode=site, --config=/config/site.json]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: authority
              mountPath: /authority
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "global-vpc-site.fullname" . }}-config
        - name: authority
          secret:
            secretName: {{ include "global-vpc-site.secret" . }}
            defaultMode: 0440
