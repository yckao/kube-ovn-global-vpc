apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "global-vpc.fullname" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "global-vpc.guardRole" . }}
rules:
  - apiGroups: [platform.globalvpc.io]
    resources: [vpcs, subnets, networkbindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [platform.globalvpc.io]
    resources: [vpcs/status, subnets/status, networkbindings/status]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "global-vpc.guardRole" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "global-vpc.guardRole" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "global-vpc.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "global-vpc.fullname" . }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, create, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "global-vpc.fullname" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "global-vpc.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "global-vpc.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "global-vpc.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "global-vpc.fullname" . }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "global-vpc.platform" . | sha256sum }}
      labels:
        app: {{ include "global-vpc.fullname" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "global-vpc.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ include "global-vpc.fullname" . }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: controller
          image: {{ include "global-vpc.image" .Values.image | quote }}
          args: [--mode=authority, --config=/config/platform.json, {{ printf "--namespace=%s" .Release.Namespace | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "global-vpc.fullname" . }}-config
