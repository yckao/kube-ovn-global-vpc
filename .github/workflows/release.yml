name: Prepare release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build reviewable release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Validate source
        run: |
          go mod verify
          make check test test-race build docs
      - name: Install pinned envtest tooling
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@3be3f1bf2b2fcc6b5c9510d55c6a9972294653d0
      - name: Verify API integration
        shell: bash
        run: |
          export KUBEBUILDER_ASSETS="$(setup-envtest use 1.36.2 --bin-dir "$RUNNER_TEMP/envtest" -p path)"
          make test-integration
      - name: Package clean source
        run: make release-artifacts
      - name: Upload unsigned artifacts for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
