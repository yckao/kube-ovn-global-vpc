name: Build prebuilt release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version matching VERSION (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      publish:
        description: Push OCI images and create a GitHub prerelease (false builds downloadable binary candidates only)
        default: false
        type: boolean
      controller_base:
        description: Reviewed distroless nonroot image NAME@sha256:digest (required to publish)
        type: string
      gateway_base:
        description: Reviewed Alpine 3.21 image NAME@sha256:digest (required to publish)
        type: string
      native_base_v1163:
        description: Verified original Kube-OVN v1.16.3 linux/amd64 image NAME@sha256:digest
        type: string
      native_base_v1164:
        description: Verified original Kube-OVN v1.16.4 linux/amd64 image NAME@sha256:digest
        type: string

permissions:
  contents: read

concurrency:
  group: prebuilt-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package and optionally publish
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_PUBLISH: ${{ inputs.publish }}
      CONTROLLER_BASE: ${{ inputs.controller_base }}
      GATEWAY_BASE: ${{ inputs.gateway_base }}
      NATIVE_BASE_V1163: ${{ inputs.native_base_v1163 }}
      NATIVE_BASE_V1164: ${{ inputs.native_base_v1164 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate release identity and inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release', 'scripts/assemble-release.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          version = release.require_version(os.environ['RELEASE_VERSION'])
          assert version == 'v' + Path('VERSION').read_text().strip(), 'Input must match VERSION'
          if os.environ['RELEASE_PUBLISH'] == 'true':
              for name in ('CONTROLLER_BASE', 'GATEWAY_BASE', 'NATIVE_BASE_V1163', 'NATIVE_BASE_V1164'):
                  release.require_image(os.environ[name])
          PY
          if [[ "$RELEASE_PUBLISH" == true ]]; then
            EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/$RELEASE_VERSION")
            test -z "$EXISTING_TAG" || {
              echo 'Refusing to overwrite an existing release tag'; exit 1;
            }
          fi
          echo "RELEASE_DIR=$GITHUB_WORKSPACE/dist/$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned Helm for chart packaging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helm"
          curl --fail --silent --show-error --location \
            https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz -o "$RUNNER_TEMP/helm/helm.tar.gz"
          curl --fail --silent --show-error --location \
            https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum -o "$RUNNER_TEMP/helm/checksum"
          (cd "$RUNNER_TEMP/helm" && sed 's/helm-v3.17.3-linux-amd64.tar.gz/helm.tar.gz/' checksum | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/helm/helm.tar.gz" -C "$RUNNER_TEMP/helm"
          echo "$RUNNER_TEMP/helm/linux-amd64" >> "$GITHUB_PATH"
      - name: Validate source and CLI
        run: |
          go mod verify
          make check test test-race build
          python3 scripts/build-docs.py --output "$RUNNER_TEMP/docs" --check
          ./bin/vpcctl --version
      - name: Install pinned envtest tooling
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@3be3f1bf2b2fcc6b5c9510d55c6a9972294653d0
      - name: Verify Kubernetes API integration
        shell: bash
        run: |
          export KUBEBUILDER_ASSETS="$(setup-envtest use 1.36.2 --bin-dir "$RUNNER_TEMP/envtest" -p path)"
          make test-integration
      - name: Package clean source and all CLI platforms
        run: make release-artifacts
      - name: Package primary Helm charts
        shell: bash
        run: |
          set -euo pipefail
          for chart in global-vpc global-vpc-site kube-ovn-global-vpc-extension; do
            helm package "charts/$chart" --version "${RELEASE_VERSION#v}" \
              --app-version "$RELEASE_VERSION" --destination "$RELEASE_DIR"
          done
          if [[ "$RELEASE_PUBLISH" != true ]]; then
            cat > "$RELEASE_DIR/CANDIDATE-NOTES.md" <<'EOF'
          These are local build candidates. No OCI images, GitHub release or
          installable release.json were published. CLI binaries are ready for
          review; chart source defaults still require immutable image values.
          A published release replaces those defaults with its verified digests.
          EOF
          fi
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release', 'scripts/assemble-release.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          release.write_checksums(Path(os.environ['RELEASE_DIR']))
          PY
      - name: Preserve corresponding project source and Go dependency licenses
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/project-source"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/project-source"
          (cd "$RUNNER_TEMP/project-source" && GOWORK=off GOFLAGS= go mod vendor)
          tar --exclude=.git --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf "$RELEASE_DIR/project-vendored-source.tar.gz" -C "$RUNNER_TEMP/project-source" .
      - name: Prepare maintainer-only container and Helm tools
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-evidence"
          docker buildx create --name global-vpc-release --driver docker-container --use
          docker buildx inspect --bootstrap
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx version > "$RUNNER_TEMP/image-evidence/buildx-version.txt"
          "$RUNNER_TEMP/helm/linux-amd64/helm" version --short > "$RUNNER_TEMP/image-evidence/helm-version.txt"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          inputs = {name: os.environ[name] for name in ('CONTROLLER_BASE', 'GATEWAY_BASE', 'NATIVE_BASE_V1163', 'NATIVE_BASE_V1164')}
          inputs.update(sourceCommit=os.environ['GITHUB_SHA'], version=os.environ['RELEASE_VERSION'], platform='linux/amd64')
          Path(os.environ['RUNNER_TEMP'], 'image-evidence', 'build-inputs.json').write_text(json.dumps(inputs, indent=2) + '\n')
          PY
      - name: Publish controller, gateway and hook-helper images with OCI SBOM and provenance
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          CONTEXT="$RUNNER_TEMP/controller-image"
          mkdir -p "$CONTEXT/gateway"
          tar -xzf "$RELEASE_DIR/platform-vpc-controller_${RELEASE_VERSION#v}_linux_amd64.tar.gz" -C "$CONTEXT"
          cp gateway/gateway.py gateway/managed.py gateway/overlay.py gateway/evpn.py "$CONTEXT/gateway/"
          docker buildx build --platform linux/amd64 --provenance=mode=max --sbom=true \
            --build-arg "CONTROLLER_BASE=$CONTROLLER_BASE" --build-arg "VERSION=$RELEASE_VERSION" \
            --build-arg "SOURCE_COMMIT=$GITHUB_SHA" -f build/release-controller.Dockerfile \
            --metadata-file "$RUNNER_TEMP/image-evidence/controller-metadata.json" \
            -t "$IMAGE_PREFIX/platform-vpc-controller:$RELEASE_VERSION" --push "$CONTEXT"
          docker buildx build --platform linux/amd64 --provenance=mode=max --sbom=true \
            --build-arg "GATEWAY_BASE=$GATEWAY_BASE" --build-arg "VERSION=$RELEASE_VERSION" \
            --build-arg "SOURCE_COMMIT=$GITHUB_SHA" -f gateway/Dockerfile \
            --metadata-file "$RUNNER_TEMP/image-evidence/gateway-metadata.json" \
            -t "$IMAGE_PREFIX/gateway:$RELEASE_VERSION" --push gateway
          CLI_CONTEXT="$RUNNER_TEMP/cli-image"
          mkdir "$CLI_CONTEXT"
          tar -xzf "$RELEASE_DIR/vpcctl_${RELEASE_VERSION#v}_linux_amd64.tar.gz" -C "$CLI_CONTEXT"
          docker buildx build --platform linux/amd64 --provenance=mode=max --sbom=true \
            --build-arg "CONTROLLER_BASE=$CONTROLLER_BASE" --build-arg "VERSION=$RELEASE_VERSION" \
            --build-arg "SOURCE_COMMIT=$GITHUB_SHA" -f build/vpcctl.Dockerfile \
            --metadata-file "$RUNNER_TEMP/image-evidence/cli-metadata.json" \
            -t "$IMAGE_PREFIX/vpcctl:$RELEASE_VERSION" --push "$CLI_CONTEXT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.publish
        with:
          go-version: '1.26.6'
          cache: false
      - name: Build, test and publish pinned native v1.16.3
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          ./bin/vpcctl maintainer native build --target v1.16.3 --repository "$GITHUB_WORKSPACE" \
            --go "$(command -v go)" --base-image "$NATIVE_BASE_V1163" \
            --image "$IMAGE_PREFIX/kube-ovn:v1.16.3-globalvpc-${RELEASE_VERSION#v}" \
            --output "$RUNNER_TEMP/native-v1.16.3"
          python3 scripts/package-native-source.py --native-output "$RUNNER_TEMP/native-v1.16.3" \
            --go "$(command -v go)" --output "$RELEASE_DIR/native-v1.16.3-source.tar.gz"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.publish
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build, test and publish pinned native v1.16.4
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          ./bin/vpcctl maintainer native build --target v1.16.4 --repository "$GITHUB_WORKSPACE" \
            --go "$(command -v go)" --base-image "$NATIVE_BASE_V1164" \
            --image "$IMAGE_PREFIX/kube-ovn:v1.16.4-globalvpc-${RELEASE_VERSION#v}" \
            --output "$RUNNER_TEMP/native-v1.16.4"
          python3 scripts/package-native-source.py --native-output "$RUNNER_TEMP/native-v1.16.4" \
            --go "$(command -v go)" --output "$RELEASE_DIR/native-v1.16.4-source.tar.gz"
      - name: Verify pushed manifests and assemble immutable release descriptor
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/collect-image-evidence.py --evidence "$RUNNER_TEMP/image-evidence" \
            --version "$RELEASE_VERSION" --source-commit "$GITHUB_SHA" \
            --image-prefix "$IMAGE_PREFIX" --native-output "$RUNNER_TEMP/native-v1.16.3" \
            --native-output "$RUNNER_TEMP/native-v1.16.4"
          python3 scripts/package-helm-release.py --version "$RELEASE_VERSION" --output "$RELEASE_DIR" \
            --controller-image "$(cat "$RUNNER_TEMP/image-evidence/controller-image.txt")" \
            --gateway-image "$(cat "$RUNNER_TEMP/image-evidence/gateway-image.txt")" \
            --cli-image "$(cat "$RUNNER_TEMP/image-evidence/cli-image.txt")" \
            --native-output "$RUNNER_TEMP/native-v1.16.3" --native-output "$RUNNER_TEMP/native-v1.16.4"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf "$RELEASE_DIR/image-evidence.tar.gz" -C "$RUNNER_TEMP/image-evidence" .
          python3 scripts/assemble-release.py --version "$RELEASE_VERSION" --source-commit "$GITHUB_SHA" \
            --controller-image "$(cat "$RUNNER_TEMP/image-evidence/controller-image.txt")" \
            --gateway-image "$(cat "$RUNNER_TEMP/image-evidence/gateway-image.txt")" \
            --cli-image "$(cat "$RUNNER_TEMP/image-evidence/cli-image.txt")" --repository "$GITHUB_REPOSITORY" \
            --native-output "$RUNNER_TEMP/native-v1.16.3" --native-output "$RUNNER_TEMP/native-v1.16.4" \
            --artifacts "$RELEASE_DIR"
          (cd "$RELEASE_DIR" && sha256sum -c SHA256SUMS)
      - name: Publish primary charts to GHCR Helm OCI
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          for chart in "$RELEASE_DIR"/*.tgz; do
            helm push "$chart" "oci://$IMAGE_PREFIX/charts"
          done
      - name: Finalize complete artifact checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release', 'scripts/assemble-release.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          release.write_checksums(Path(os.environ['RELEASE_DIR']))
          PY
          (cd "$RELEASE_DIR" && sha256sum -c SHA256SUMS)
      - name: Upload all reviewable artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ inputs.version }}-${{ github.sha }}
          path: dist/v*/
          if-no-files-found: warn
          retention-days: 14
      - name: Create experimental GitHub prerelease
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Prebuilt vpcctl for Linux/macOS on amd64/arm64, and immutable Linux/amd64
          platform, gateway, hook-helper and native Kube-OVN images. Helm charts
          are primary distribution, available as release assets and GHCR OCI.
          Use the published charts with Helm or vpcctl; release.json records
          their image digests and native bundles. Installation requires no local
          Go, Docker or BuildKit.

          Verify SHA256SUMS before use. OCI images include BuildKit provenance and
          SBOM attestations; source archives preserve project/native source,
          changes, vendored Go dependencies and included licenses. image-evidence
          records actual base images, toolchains, OS package SBOM and qualification.
          THIRD_PARTY_NOTICES.md describes remaining redistribution obligations;
          inventories and source URLs are not a legal-compliance certification.

          Experimental: native unit tests and Kubernetes API tests do not prove
          real OVN/northd, BFD failover or cross-site packet forwarding. These
          runtime qualifications are explicitly recorded as not-run.
          EOF
          gh release create "$RELEASE_VERSION" "$RELEASE_DIR"/* --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: End registry session
        if: always() && inputs.publish
        run: |
          docker logout ghcr.io
          helm registry logout ghcr.io
