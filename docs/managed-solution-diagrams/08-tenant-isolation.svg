<text xml:space="preserve" x="314" y="364" font-size="23" fill="#53647C" font-weight="400" text-anchor="start" data-max-width="360">10.60.1.0/24</text>
<text xml:space="preserve" x="314" y="398" font-size="23" fill="#53647C" font-weight="400" text-anchor="start" data-max-width="360">獨立 native resource identity</text>
