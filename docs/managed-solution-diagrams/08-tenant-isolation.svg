<rect x="776" y="302" width="5" height="133" rx="2" fill="#B83D58" stroke="none" stroke-width="1.5"/>
<text xml:space="preserve" x="800" y="326" font-size="26" fill="#B83D58" font-weight="650" text-anchor="start" data-max-width="320">Tenant Gateways</text>
<text xml:space="preserve" x="800" y="364" font-size="23" fill="#53647C" font-weight="400" text-anchor="start" data-max-width="320">network namespace / VRF</text>
<text xml:space="preserve" x="800" y="398" font-size="23" fill="#53647C" font-weight="400" text-anchor="start" data-max-width="320">獨立 key / VNI context</text>
