<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">CIDR 可以重疊，租戶的路由識別不能混在一起</title><desc id="desc">Project / VPC identity → native VPC → Gateway namespace / VRF → transport context</desc>
<defs><style>text{font-family:"PingFang TC","Heiti TC","Noto Sans CJK TC",Arial,sans-serif}</style>
