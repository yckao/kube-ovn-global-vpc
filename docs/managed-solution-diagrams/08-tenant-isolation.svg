<text xml:space="preserve" x="800" y="628" font-size="23" fill="#53647C" font-weight="400" text-anchor="start" data-max-width="320">network namespace / VRF</text>
<text xml:space="preserve" x="800" y="662" font-size="23" fill="#53647C" font-weight="400" text-anchor="start" data-max-width="320">獨立 key / VNI context</text>
<rect x="1222" y="548" width="606" height="169" rx="16" fill="#FFFFFF" stroke="#D6E0EC" stroke-width="1.5"/>
