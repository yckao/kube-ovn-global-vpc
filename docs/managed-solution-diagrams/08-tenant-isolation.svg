<rect x="1222" y="302" width="5" height="133" rx="2" fill="#B83D58" stroke="none" stroke-width="1.5"/>
<text xml:space="preserve" x="1246" y="326" font-size="26" fill="#B83D58" font-weight="650" text-anchor="start" data-max-width="558">DC-B native VPC</text>
<text xml:space="preserve" x="1246" y="364" font-size="23" fill="#53647C" font-weight="400" text-anchor="start" data-max-width="558">10.61.1.0/24</text>
<text xml:space="preserve" x="1246" y="398" font-size="23" fill="#53647C" font-weight="400" text-anchor="start" data-max-width="558">同 CIDR 不代表同一個 route domain</text>
