<rect x="64" y="802" width="5" height="72" rx="2" fill="#087F83" stroke="none" stroke-width="1.5"/>
<text xml:space="preserve" x="88" y="826" font-size="25" fill="#087F83" font-weight="650" text-anchor="start" data-max-width="816">控制面隔離</text>
<text xml:space="preserve" x="88" y="864" font-size="23" fill="#53647C" font-weight="400" text-anchor="start" data-max-width="816">租戶只操作 public API；Binding / native resources 由平台管理</text>
<rect x="960" y="784" width="896" height="108" rx="16" fill="#E8F7F5" stroke="#D6E0EC" stroke-width="1.5"/>
<rect x="960" y="802" width="5" height="72" rx="2" fill="#087F83" stroke="none" stroke-width="1.5"/>
<text xml:space="preserve" x="984" y="826" font-size="25" fill="#087F83" font-weight="650" text-anchor="start" data-max-width="848">配置身分隔離</text>
<text xml:space="preserve" x="984" y="864" font-size="23" fill="#53647C" font-weight="400" text-anchor="start" data-max-width="848">UID / allocation anchors 防止遺失配置後意外重用舊識別</text>
