<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">跨站封包走 Gateway，控制服務不在路徑上</title><desc id="desc">每個 VPC、每個 site 部署多個 Gateway；底層只需路由 outer endpoint，不交換 tenant routes</desc>
